name: Test custom cache key and path (dry-run)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up local Flutter manifest for offline use
        run: |
          mkdir -p /tmp/flutter-storage/flutter_infra_release/releases
          cp "$GITHUB_WORKSPACE/tests/fixtures/releases_linux.json" \
            /tmp/flutter-storage/flutter_infra_release/releases/releases_linux.json

      - id: action
        uses: .
        with:
          channel: stable
          cache-key: "my-custom-flutter-key-:version:"
          cache-path: "/tmp/flutter-sdk"
          pub-cache-key: "my-pub-key-:version:"
          pub-cache-path: "/tmp/pub-cache"
          dry-run: "true"
        env:
          FLUTTER_STORAGE_BASE_URL: "file:///tmp/flutter-storage"
          RUNNER_OS: Linux
          RUNNER_ARCH: X64
          RUNNER_TEMP: /tmp
          RUNNER_TOOL_CACHE: /opt/hostedtoolcache

      - name: Assert CACHE-KEY contains custom prefix
        env:
          CACHE_KEY: ${{ steps.action.outputs.CACHE-KEY }}
        run: |
          echo "CACHE-KEY: $CACHE_KEY"
          if [ -z "$CACHE_KEY" ]; then
            echo "FAIL: expected non-empty CACHE-KEY"
            exit 1
          fi
          if ! echo "$CACHE_KEY" | grep -q "my-custom-flutter-key-"; then
            echo "FAIL: expected CACHE-KEY to contain 'my-custom-flutter-key-', got '$CACHE_KEY'"
            exit 1
          fi
          echo "PASS: CACHE-KEY=$CACHE_KEY"

      - name: Assert CACHE-PATH is the custom path
        env:
          CACHE_PATH: ${{ steps.action.outputs.CACHE-PATH }}
        run: |
          echo "CACHE-PATH: $CACHE_PATH"
          if [ "$CACHE_PATH" != "/tmp/flutter-sdk" ]; then
            echo "FAIL: expected CACHE-PATH='/tmp/flutter-sdk', got '$CACHE_PATH'"
            exit 1
          fi
          echo "PASS"

      - name: Assert PUB-CACHE-KEY contains custom prefix
        env:
          PUB_CACHE_KEY: ${{ steps.action.outputs.PUB-CACHE-KEY }}
        run: |
          echo "PUB-CACHE-KEY: $PUB_CACHE_KEY"
          if [ -z "$PUB_CACHE_KEY" ]; then
            echo "FAIL: expected non-empty PUB-CACHE-KEY"
            exit 1
          fi
          if ! echo "$PUB_CACHE_KEY" | grep -q "my-pub-key-"; then
            echo "FAIL: expected PUB-CACHE-KEY to contain 'my-pub-key-', got '$PUB_CACHE_KEY'"
            exit 1
          fi
          echo "PASS: PUB-CACHE-KEY=$PUB_CACHE_KEY"

      - name: Assert PUB-CACHE-PATH is the custom path
        env:
          PUB_CACHE_PATH: ${{ steps.action.outputs.PUB-CACHE-PATH }}
        run: |
          echo "PUB-CACHE-PATH: $PUB_CACHE_PATH"
          if [ "$PUB_CACHE_PATH" != "/tmp/pub-cache" ]; then
            echo "FAIL: expected PUB-CACHE-PATH='/tmp/pub-cache', got '$PUB_CACHE_PATH'"
            exit 1
          fi
          echo "PASS"
