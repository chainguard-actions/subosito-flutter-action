name: Test dry-run stable channel
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock curl to serve local Flutter manifest
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-curl.sh" /usr/local/bin/curl
          chmod +x /usr/local/bin/curl

      - id: action
        uses: .
        with:
          channel: stable
          dry-run: "true"

      - name: Assert CHANNEL output is stable
        env:
          CHANNEL: ${{ steps.action.outputs.CHANNEL }}
        run: |
          echo "CHANNEL: $CHANNEL"
          if [ "$CHANNEL" != "stable" ]; then
            echo "FAIL: expected CHANNEL=stable, got '$CHANNEL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert VERSION output is non-empty
        env:
          VERSION: ${{ steps.action.outputs.VERSION }}
        run: |
          echo "VERSION: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected non-empty VERSION"
            exit 1
          fi
          echo "PASS"

      - name: Assert ARCHITECTURE output is non-empty
        env:
          ARCH: ${{ steps.action.outputs.ARCHITECTURE }}
        run: |
          echo "ARCHITECTURE: $ARCH"
          if [ -z "$ARCH" ]; then
            echo "FAIL: expected non-empty ARCHITECTURE"
            exit 1
          fi
          echo "PASS"

      - name: Assert CACHE-KEY output is non-empty
        env:
          CACHE_KEY: ${{ steps.action.outputs.CACHE-KEY }}
        run: |
          echo "CACHE-KEY: $CACHE_KEY"
          if [ -z "$CACHE_KEY" ]; then
            echo "FAIL: expected non-empty CACHE-KEY"
            exit 1
          fi
          echo "PASS"

      - name: Assert CACHE-PATH output is non-empty
        env:
          CACHE_PATH: ${{ steps.action.outputs.CACHE-PATH }}
        run: |
          echo "CACHE-PATH: $CACHE_PATH"
          if [ -z "$CACHE_PATH" ]; then
            echo "FAIL: expected non-empty CACHE-PATH"
            exit 1
          fi
          echo "PASS"

      - name: Assert PUB-CACHE-KEY output is non-empty
        env:
          PUB_CACHE_KEY: ${{ steps.action.outputs.PUB-CACHE-KEY }}
        run: |
          echo "PUB-CACHE-KEY: $PUB_CACHE_KEY"
          if [ -z "$PUB_CACHE_KEY" ]; then
            echo "FAIL: expected non-empty PUB-CACHE-KEY"
            exit 1
          fi
          echo "PASS"

      - name: Assert PUB-CACHE-PATH output is non-empty
        env:
          PUB_CACHE_PATH: ${{ steps.action.outputs.PUB-CACHE-PATH }}
        run: |
          echo "PUB-CACHE-PATH: $PUB_CACHE_PATH"
          if [ -z "$PUB_CACHE_PATH" ]; then
            echo "FAIL: expected non-empty PUB-CACHE-PATH"
            exit 1
          fi
          echo "PASS"

      - name: Assert flutter is NOT installed (dry-run)
        run: |
          if command -v flutter > /dev/null 2>&1; then
            echo "FAIL: flutter should not be installed in dry-run mode"
            exit 1
          fi
          echo "PASS: flutter not installed as expected in dry-run mode"
