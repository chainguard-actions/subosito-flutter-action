name: Test custom git-source output (dry-run)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          channel: main
          architecture: x64
          git-source: "https://github.com/flutter/flutter.git"
          dry-run: "true"

      - name: Assert CHANNEL output is main
        env:
          CHANNEL: ${{ steps.action.outputs.CHANNEL }}
        run: |
          echo "CHANNEL: $CHANNEL"
          if [ "$CHANNEL" != "main" ]; then
            echo "FAIL: expected CHANNEL=main, got '$CHANNEL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert CACHE-KEY output is non-empty
        env:
          CACHE_KEY: ${{ steps.action.outputs.CACHE-KEY }}
        run: |
          echo "CACHE-KEY: $CACHE_KEY"
          if [ -z "$CACHE_KEY" ]; then
            echo "FAIL: expected non-empty CACHE-KEY"
            exit 1
          fi
          echo "PASS: CACHE-KEY=$CACHE_KEY"

      - name: Assert CACHE-PATH output is non-empty
        env:
          CACHE_PATH: ${{ steps.action.outputs.CACHE-PATH }}
        run: |
          echo "CACHE-PATH: $CACHE_PATH"
          if [ -z "$CACHE_PATH" ]; then
            echo "FAIL: expected non-empty CACHE-PATH"
            exit 1
          fi
          echo "PASS: CACHE-PATH=$CACHE_PATH"
